# Build the ShellMan packages with packaging/build.sh: one .deb (Debian,
# Ubuntu) and one .rpm (Fedora, RHEL, openSUSE). They are uploaded as workflow
# artifacts and, for a tag, attached to the GitHub release.
name: Packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.kind }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: deb, image: 'ubuntu:24.04' }
          - { kind: rpm, image: 'almalinux:10' }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the package
        run: packaging/build.sh ${{ matrix.kind }} '${{ matrix.image }}'

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: shellman-${{ matrix.kind }}
          path: packaging/out/*.${{ matrix.kind }}
          if-no-files-found: error

  # Separate from the builds, so that the images have no write access.
  release:
    name: Attach to the release
    # Attach what was built, even if one package failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true

      - name: Attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" packages/* --clobber
